<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dernier Cercle</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='none' stroke='%239b5de5' stroke-width='5'/></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Écran 1 : accueil (pseudo + règles) -->
  <main id="home" class="screen">
    <header class="hero">
      <div class="ring" aria-hidden="true"></div>
      <h1>Dernier Cercle</h1>
      <p class="tagline">Battle royale 2D · 10 joueurs · 10 minutes · 1 seul survivant</p>
      <form id="join-form" class="join">
        <input id="name-input" maxlength="16" placeholder="Ton pseudo" autocomplete="off" required>
        <button type="submit">Jouer</button>
      </form>
      <p id="connection-status" class="muted small"></p>
    </header>
    <section id="rules" class="rules" aria-label="Règles du jeu"></section>
  </main>

  <!-- Écran 2 : salon d'attente -->
  <main id="lobby" class="screen hidden">
    <div class="panel lobby-panel">
      <h2>Salon</h2>
      <p id="lobby-status" class="muted"></p>
      <ul id="lobby-players" class="player-list"></ul>

      <div class="settings">
        <label>
          <span>Difficulté des bots</span>
          <select id="difficulty"></select>
        </label>
        <label>
          <span>Nombre de bots : <strong id="bots-value"></strong></span>
          <input id="bots" type="range" min="0" max="9" step="1">
        </label>
        <p id="total-players" class="muted small"></p>
      </div>

      <button id="start-button" class="primary">Lancer la partie</button>
      <p id="start-hint" class="muted small"></p>

      <div class="controls-reminder">
        <span><kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> se déplacer</span>
        <span><kbd>Clic</kbd> tirer</span>
        <span><kbd>E</kbd> ramasser</span>
        <span><kbd>1</kbd><kbd>2</kbd> / molette : changer d'arme</span>
      </div>
    </div>
  </main>

  <!-- Écran 3 : la partie -->
  <main id="game" class="screen hidden">
    <canvas id="canvas"></canvas>
    <div id="damage-flash"></div>

    <div class="hud hud-top-left">
      <div id="timer" class="timer">10:00</div>
      <div class="stats">
        <span>En course <strong id="alive-count">0</strong></span>
        <span>Éliminations <strong id="kill-count">0</strong></span>
      </div>
      <div id="respawn-status" class="badge"></div>
    </div>

    <div class="hud hud-top-right">
      <canvas id="minimap" width="180" height="180"></canvas>
      <div id="zone-info" class="zone-info"></div>
      <ul id="killfeed" class="killfeed"></ul>
    </div>

    <div id="zone-warning" class="zone-warning hidden"></div>
    <div id="pickup-hint" class="pickup-hint hidden"></div>

    <div class="hud hud-bottom">
      <div class="bars">
        <div class="bar shield-bar"><div id="shield-fill" class="fill"></div><span id="shield-text"></span></div>
        <div class="bar health-bar"><div id="health-fill" class="fill"></div><span id="health-text"></span></div>
      </div>
      <div class="slots">
        <div class="slot" id="slot-0"></div>
        <div class="slot" id="slot-1"></div>
      </div>
    </div>

    <div id="overlay" class="overlay hidden"></div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
